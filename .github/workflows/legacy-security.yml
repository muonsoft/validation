name: Legacy Go security report

on:
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: Legacy Go security report
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
      - name: Install pinned scanner
        run: GOBIN="$RUNNER_TEMP/vuln-bin" go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Scan
        id: scan
        run: bash scripts/security-report.sh legacy "$RUNNER_TEMP/vuln-bin/govulncheck" "$RUNNER_TEMP/security-report"
      - name: Report incomplete scan
        if: always() && steps.scan.outcome == 'skipped'
        run: |
          mkdir -p "$RUNNER_TEMP/security-report"
          echo '## Security scan incomplete: checkout, setup or scanner installation failed. See job logs; no clean result is available.' | tee "$RUNNER_TEMP/security-report/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-go-security
          path: ${{ runner.temp }}/security-report
          if-no-files-found: error
